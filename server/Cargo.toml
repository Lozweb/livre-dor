[package]
name = "server"
version = "0.1.0"
edition = "2021"

[dependencies]
phone = { path = "../phone" }
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.5", features = ["fs", "cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
